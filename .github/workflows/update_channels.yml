name: Update and Organize Live Channels (Python)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'  # 北京时间 04:00 (UTC+8)
  push:
    paths:
      - '**/channel_crawler.py'

env:
  OUTPUT_FILENAME: 'organized_channels.txt'

jobs:
  crawl-and-organize:
    runs-on: ubuntu-latest
    
    steps:
      # 第一步：检出您的仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 第二步：设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      # 第三步：安装依赖
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      # 第四步：运行 Python 爬虫脚本
      - name: Run Channel Organizer
        run: |
          python channel_crawler.py > ${{ env.OUTPUT_FILENAME }}
          # 检查文件是否成功生成且非空
          if [ -s "${{ env.OUTPUT_FILENAME }}" ]; then
            echo "✅ 频道列表生成成功。"
            echo "文件行数："
            wc -l ${{ env.OUTPUT_FILENAME }}
          else
            echo "❌ 输出文件为空或生成失败。"
            exit 1
          fi
      
      # 第五步：检查输出是否有变化，并自动提交
      - name: Commit and Push if Changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: '${{ env.OUTPUT_FILENAME }}'
          commit_message: 'chore: 自动更新并整理直播源列表 (Python版)'
          commit_user_name: 'GitHub Actions Bot'
          commit_user_email: 'actions@github.com'
          commit_author: 'GitHub Actions Bot <actions@github.com>'
          skip_fetch: true
