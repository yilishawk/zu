name: 更新直播源 tvv.txt

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # 使用 pip 缓存加速

      - name: 安装依赖
        run: pip install requests

      - name: 生成并测速排序
        run: python tvv.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvv.txt
          # 检查文件是否存在且不为空，并且确实有改动
          if [ -s tvv.txt ] && ! git diff --staged --quiet; then
            git commit -m "Auto update tvv.txt $(date -u '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes or empty file, skipping push."
          fi
