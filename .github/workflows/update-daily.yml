name: 每天自动更新 IPTV 纯净源

on:
  schedule:
    - cron: '0 22 * * *'    # 每天北京时间 06:00（UTC 22:00）运行
  workflow_dispatch:        # 也支持手动触发

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行抓取脚本
        run: python iptv_ultimate_2025.py

      - name: 上传纯净播放列表（供下载）
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-纯净播放列表
          path: iptv_live.txt

      - name: 提交更新到仓库
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iptv_live.txt iptv_history_with_time.json
          git commit -m "自动更新 IPTV 纯净源 $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
