name: IPTV Auto Scraper

on:
  schedule:
    - cron: '0 22 * * *'   # 每天 UTC 22:00 = 北京时间 早上 6:00
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pycryptodome

      - name: 运行 IPTV 抓取 + 过滤
        run: |
          python iptv_scraper.py

      - name: 提交并推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add iptv_live.txt iptv_history.txt
          [ -f iptv_backup.txt ] && git add iptv_backup.txt || echo "无备份文件，跳过"
          
          git diff --quiet && git diff --staged --quiet && echo "无变化，跳过提交" && exit 0
          
          git commit -m "Auto update IPTV sources $(date -u '+%Y-%m-%d %H:%M UTC')"
          
          git pull origin main --rebase
          git push origin main --force-with-lease
