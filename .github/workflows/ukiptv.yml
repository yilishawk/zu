name: ukiptv

on:
  schedule:
    # 每天北京时间早上 6 点自动运行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python 运行环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        pip install requests

    - name: 执行抓取脚本
      run: |
        python ukiptv.py  # ⚠️ 请确保这里改成你 Python 文件名

    - name: 提交更新后的列表
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add ukiptv.txt ip/*.txt
        git commit -m "自动更新 IPTV 列表: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
        git push
