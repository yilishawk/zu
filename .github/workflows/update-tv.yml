# .github/workflows/update-tv.yml
name: 更新直播源 tv.m3u

on:
  schedule:
    - cron: '30 0 * * *'          # 每天 UTC 00:30 → 北京时间 08:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install requests

      - name: 生成最新 tv.m3u
        run: python tv.py

      - name: 提交更新（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv.m3u
          
          if git diff --staged --quiet; then
            echo "tv.m3u 无变化，跳过提交"
          else
            git commit -m "Auto update tv.m3u $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "tv.m3u 已更新并推送"
          fi
