name: 自动更新直播源

on:
  schedule:
    - cron: '0 22 * * *' # 每天北京时间早上6点运行
  workflow_dispatch:      # 允许手动触发运行

permissions:
  contents: write         # 必须：赋予 Action 写入并推送文件的权限

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # 使用缓存提速

      - name: 安装依赖
        run: |
          # 即使脚本里有自动安装逻辑，在这里安装更稳妥
          pip install requests

      - name: 执行测速排序脚本
        run: |
          # 确保您的脚本文件名是 tv.py
          python tv.py

      - name: 检查生成的文件并推送
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 尝试添加所有可能生成的文件名（兼容 tv.txt 或 tv.m3u）
          git add tv.txt || true
          git add tv.m3u || true
          
          # 检查是否有内容变动
          if ! git diff --staged --quiet; then
            git commit -m "Auto update: $(date +'%Y-%m-%d %H:%M')"
            # 自动探测当前分支并推送
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git push origin $BRANCH
          else
            echo "没有发现内容变动，跳过提交。"
          fi

      - name: 异常检查
        if: failure()
        run: echo "工作流运行失败，请检查 tv.py 里的 URL 链接是否有效。"
